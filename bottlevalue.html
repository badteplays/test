<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOTTLE VALUE</title>
    <link rel="stylesheet" href="bottlevalue.css">
    <script type="module" src="bottlevalue.js"></script>
</head>
<body>

    <header class="main-header">
        <button id="menu-button" class="menu-button">
            <span class="menu-text">MENU</span>
            <span class="menu-icon">☰</span>
        </button>

        <nav class="top-nav">
            <span class="admin-label">ADMIN |</span>
            <button id="logoutBtn" class="logout-btn">LOGOUT</button>
        </nav>
    </header>

    <main class="content-wrapper">
        <h1 class="page-title">BOTTLE VALUE</h1>

        <div class="items-container">
            
            <div class="item-card">
                <img src="images/1000ml.png" alt="Pen" class="item-image red-border">
                <div class="item-details">
                    <p class="item-name">1000ML</p>
                    <div class="price-controls">
    <input type="number" class="price-input" step="0.1" min="0" value="0" disabled>
</div>
                </div>
            </div>

            <div class="item-card">
                <img src="images/500ml.png" alt="Marker" class="item-image orange-border">
                <div class="item-details">
                    <p class="item-name">500ML</p>
                    <div class="price-controls">
    <input type="number" class="price-input" step="0.1" min="0" value="0" disabled>
</div>
                </div>
            </div>

            <div class="item-card">
                <img src="images/350ml.png" alt="Intermediate Paper" class="item-image yellow-border">
                <div class="item-details">
                    <p class="item-name">350ML</p>
                    <div class="price-controls">
    <input type="number" class="price-input" step="0.1" min="0" value="0" disabled>
</div>
                </div>
            </div>
            
            
            
        </div>

        <button id="edit" class="edit">EDIT</button>
         
    </main>
        
</body>
</html>
