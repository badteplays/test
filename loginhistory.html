<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login History - Supplify Stationery Dispenser</title>
    <link rel="stylesheet" href="loginhistory.css">
    <script type="module" src="loginhistory.js"></script>
</head>

<body>
    <header class="main-header">
        <button id="menu-button" class="menu-button">
            <span class="menu-text">MENU</span>
            <span class="menu-icon">☰</span>
        </button>

        <nav class="top-nav">
            <span class="admin-label">ADMIN |</span>
            <button id="logoutBtn" class="logout-btn">LOGOUT</button>
        </nav>
    </header>

    <main class="content-wrapper">
        <h1 class="page-title">LOGIN<br>HISTORY</h1>

        <div class="table-controls">
            <input type="search" id="history-search" class="search-input" placeholder="Search by Name, UID, or Date..." aria-label="Search login history">
            <button type="button" id="export-csv-btn" class="export-btn">EXPORT CSV</button>
        </div>

        <div class="accounts-container">
            <div tabindex="0" role="region" aria-label="Login History Table" class="table-wrapper">
                <table id="accounts-table">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>UID</th>
                            <th>DATE</th>
                            <th>TIME</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="4" style="text-align:center; padding: 20px;">Loading login history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>

</html>
